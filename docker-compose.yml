version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cirp_postgres
    environment:
      POSTGRES_DB: cirp_index
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cirp_index"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
